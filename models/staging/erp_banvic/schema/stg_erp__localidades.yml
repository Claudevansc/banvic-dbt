models:
  - name: stg_erp__localidades
    description: Modelo staging para os dados de localidades provenientes do sistema ERP.
    columns:
    - name: cod_localidade
      description: Chave primária da tabela localidades.
    - name: cidade
      description: Nome da cidade daquela localidade.
    - name: uf
      description: Código UF do estado do qual se refere aquela cidade/localidade.